<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful | Download The Cold Approach Handbook</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #000;
        color: #fff;
        font-family: 'Space Mono', monospace;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
        background-size: 20px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      ::selection { background-color: #fff; color: #000; }
      a { color: inherit; text-decoration: none; }
      
      .font-display { font-family: 'Bebas Neue', Impact, sans-serif; }
      .font-accent { font-family: 'Oswald', sans-serif; }
      .font-body { font-family: 'Space Mono', monospace; }

      .btn-primary {
        display: inline-block;
        border: 3px solid #fff;
        background: #fff;
        color: #000;
        padding: 20px 40px;
        font-family: 'Bebas Neue', Impact, sans-serif;
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: all 0.15s ease;
        cursor: pointer;
        text-align: center;
      }
      .btn-primary:hover { background: #000; color: #fff; }
      .btn-primary:active { transform: scale(0.95); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

      @media (min-width: 768px) {
        .btn-primary { font-size: 1.5rem; }
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 64px 24px;
        text-align: center;
      }

      .card {
        border: 3px solid #fff;
        background-color: #000;
        padding: 24px;
        width: 100%;
        max-width: 448px;
        margin-bottom: 32px;
        text-align: left;
      }
    </style>
  </head>
  <body>

    <main>
      <div style="margin-bottom:32px; width:80px; height:80px; border-radius:50%; border:3px solid #22c55e; display:flex; align-items:center; justify-content:center;">
        <span style="font-size:36px; color:#22c55e;">✓</span>
      </div>

      <h1 class="font-display" style="font-size:clamp(2.25rem, 8vw, 3.75rem); text-transform:uppercase; letter-spacing:-0.025em; line-height:1; margin-bottom:24px;">
        Payment Successful!
      </h1>

      <p class="font-body" style="font-size:clamp(1rem, 3vw, 1.25rem); color:rgba(255,255,255,0.7); max-width:512px; margin-bottom:32px;">
        Thank you for your purchase. Your guide is ready for download.
      </p>

      <div class="card">
        <div style="display:flex; align-items:flex-start; gap:16px;">
          <div style="width:80px; height:112px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <span class="font-display" style="font-size:1.5rem; color:rgba(255,255,255,0.5);">PDF</span>
          </div>
          <div style="flex:1;">
            <h3 class="font-accent" style="font-size:1.125rem; text-transform:uppercase; letter-spacing:0.025em; margin-bottom:4px;">The Cold Approach Handbook</h3>
            <p class="font-body" style="font-size:0.875rem; color:rgba(255,255,255,0.5); margin-bottom:8px;">Digital PDF • Instant Download</p>
            <span class="font-body" style="display:inline-block; padding:4px 8px; background:rgba(34,197,94,0.2); color:#4ade80; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">Purchased</span>
          </div>
        </div>
      </div>

      <button id="downloadBtn" onclick="downloadFile()" class="btn-primary" style="margin-bottom:24px;">
        <span id="btnText">Download Your Guide →</span>
      </button>

      <p class="font-body" style="font-size:0.875rem; color:rgba(255,255,255,0.4);">
        Having trouble? <a id="directLink" href="#" target="_blank" rel="noopener noreferrer" style="text-decoration:underline; transition:color 0.15s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color=''">Click here to open directly</a>
      </p>
    </main>

    <footer style="padding:32px 24px; border-top:1px solid rgba(255,255,255,0.1);">
      <div style="max-width:896px; margin:0 auto; display:flex; flex-direction:column; justify-content:space-between; align-items:center; gap:16px;">
        <div style="display:flex; gap:24px;">
          <a href="/" class="font-body" style="font-size:0.875rem; color:rgba(255,255,255,0.5); transition:color 0.15s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">← Main Site</a>
        </div>
        <p class="font-body" style="font-size:0.75rem; color:rgba(255,255,255,0.3);">
          © <script>document.write(new Date().getFullYear())</script> Stark Rizz
        </p>
      </div>
    </footer>

    <script>
      const PDF_DOWNLOAD_URL = './guides/Stark Rizz Cold Approach Ebook.pdf';
      const PDF_FILENAME = 'The-Cold-Approach-Handbook.pdf';

      document.getElementById('directLink').href = PDF_DOWNLOAD_URL;

      function downloadFile() {
        const btn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        
        btn.disabled = true;
        btnText.textContent = 'Downloading...';

        const link = document.createElement('a');
        link.href = PDF_DOWNLOAD_URL;
        link.download = PDF_FILENAME;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => {
          btnText.textContent = 'Download Your Guide →';
          btn.disabled = false;
        }, 2000);
      }
    </script>
  </body>
</html>
